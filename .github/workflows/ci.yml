name: steward
on: [push, pull_request]
jobs:
  constitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test constitution/tests/governance_actions_test.js
      - run: node research/agent-verifiers/run.mjs
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install cryptography
      - run: python steward/compose_constitution.py --output /tmp/constitution.js
      - run: node -e "new (require('vm').Script)(require('fs').readFileSync('/tmp/constitution.js','utf8').replace(/^export /gm,''))"
      - run: python -m unittest discover -s steward/tests -p 'test_*.py' -v
